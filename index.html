<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลักสูตร ฝอ.ตร. 47</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        .seat-card {
            transition: all 0.2s ease-in-out;
            min-height: 120px;
        }
        .seat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }
        /* แอนิเมชันเรืองแสงสีทอง (ชาย) */
        .on-duty-glow {
            animation: pulse-amber 2s infinite;
            border-color: #f59e0b !important;
            background-color: #fffbeb !important;
        }
        @keyframes pulse-amber {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        /* แอนิเมชันเรืองแสงสีชมพู (หญิง) */
        .on-duty-pink-glow {
            animation: pulse-pink 2s infinite;
            border-color: #ec4899 !important;
            background-color: #fdf2f8 !important;
        }
        @keyframes pulse-pink {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        .modal-enter {
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .grid-container::-webkit-scrollbar {
            height: 8px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .classroom-grid {
            display: grid;
            grid-template-columns: 60px repeat(12, minmax(85px, 1fr));
            gap: 0.6rem;
            min-width: 1200px;
        }
        .info-pill {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
        }
        .refresh-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="pb-20">

    <!-- Hero Banner Section -->
    <div class="w-full h-20 md:h-28 overflow-hidden relative shadow-md">
        <img src="https://lh3.googleusercontent.com/d/1dSVj8D0LjJ0ArXvjqsMdna9tqA8OnEOB" 
             alt="Banner หลักสูตร ฝอ.ตร. 47" 
             class="w-full h-full object-cover object-center"
             onerror="this.src='https://www.transparenttextures.com/patterns/cubes.png'; this.parentElement.classList.add('bg-blue-950')">
        <div class="absolute inset-0 bg-gradient-to-t from-blue-950 via-blue-950/20 to-transparent"></div>
    </div>

    <!-- Header Section -->
    <header class="bg-blue-950 text-white pb-10 shadow-xl sticky top-0 z-40 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] -mt-1">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white pt-4">หลักสูตร ฝอ.ตร. 47</h1>
            
            <div class="mt-3 inline-flex items-center bg-blue-900/50 px-4 py-1.5 rounded-full border border-blue-800 backdrop-blur-sm">
                <span class="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
                <span id="todayDateDisplay" class="text-amber-400 font-bold text-xs md:text-sm tracking-wide">
                    วันที่ ...
                </span>
            </div>
            
            <div class="max-w-xl mx-auto mt-6 flex gap-2 px-2">
                <div class="relative group flex-grow">
                    <input type="text" id="searchInput" placeholder="ค้นหาด้วย เลขที่, ชื่อ หรือชื่อเล่น..." 
                        class="w-full px-6 py-3 rounded-full border-none text-gray-800 focus:ring-4 focus:ring-blue-500 shadow-2xl transition-all pl-12 text-lg">
                    <div class="absolute left-4 top-3.5 text-gray-400 group-focus-within:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                </div>
                <button onclick="refreshData()" id="refreshBtn" title="รีเฟรชข้อมูล" 
                    class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-full shadow-2xl transition-all active:scale-95 flex items-center justify-center">
                    <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-6 space-y-8">
        <!-- Section 1: Seating Grid -->
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8">
            <div class="w-full bg-gradient-to-r from-slate-800 to-slate-700 py-4 mb-12 rounded-xl text-center text-white font-bold tracking-[0.8em] shadow-lg border-b-4 border-blue-500 uppercase text-sm">
                หน้าชั้นเรียน / วิทยากร
            </div>

            <div class="grid-container overflow-x-auto pb-6">
                <div id="seatingGrid" class="classroom-grid">
                    <div class="col-span-full text-center py-24">
                        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-900 border-t-transparent"></div>
                        <p class="mt-4 text-slate-500 font-bold animate-pulse">กำลังโหลดผังที่นั่งและตารางเวร...</p>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex flex-wrap justify-center gap-6 text-[10px] md:text-xs text-slate-500 border-t pt-6 uppercase font-bold tracking-wider">
                <div class="flex items-center"><span class="w-3 h-3 bg-white border border-blue-200 rounded mr-2"></span> ปกติ (ชาย)</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-white border border-pink-200 rounded mr-2"></span> ปกติ (หญิง)</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-amber-400 border border-amber-600 rounded mr-2"></span> เวรประจำวัน (ช)</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-pink-400 border border-pink-600 rounded mr-2"></span> เวรประจำวัน (ญ)</div>
            </div>
        </div>
    </main>

    <!-- Detailed Profile Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex items-center justify-center p-2 md:p-4 backdrop-blur-md transition-all">
        <div class="bg-white w-full max-w-lg md:rounded-[2rem] shadow-2xl overflow-hidden modal-enter flex flex-col max-h-[95vh]">
            
            <!-- Modal Header with Compact Image -->
            <div class="relative w-full h-[200px] md:h-[260px] bg-slate-200 flex-shrink-0">
                <img id="modalImg" src="" alt="Police Profile" class="w-full h-full object-cover block">
                <div id="modalPlaceholderIcon" class="w-full h-full flex items-center justify-center bg-slate-100 scale-150 hidden"></div>
                
                <!-- Overlay Shadow -->
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-black/10"></div>

                <!-- Floating Close Button -->
                <button onclick="closeModal()" class="absolute top-4 right-4 text-white bg-black/40 hover:bg-black/60 p-2 rounded-full backdrop-blur-md transition-all z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Status Badge -->
                <div id="modalDutyIndicator" class="absolute top-4 left-4 hidden z-10">
                    <span id="modalDutyBadge" class="flex items-center px-3 py-1.5 rounded-full text-[10px] font-black shadow-xl ring-2 ring-white animate-bounce">
                        เข้าเวรวันนี้
                    </span>
                </div>

                <!-- Name and Info Floating on Image -->
                <div class="absolute bottom-0 left-0 w-full p-5 text-white">
                    <div id="modalSeatNum" class="inline-block bg-yellow-400 text-blue-950 font-black px-2.5 py-0.5 rounded shadow-lg text-[10px] mb-2">
                        ที่นั่ง #00
                    </div>
                    <h2 id="modalFullName" class="text-2xl md:text-3xl font-black mb-0.5 drop-shadow-lg">ยศ ชื่อ นามสกุล</h2>
                    <p id="modalNickname" class="text-blue-200 font-bold italic text-base drop-shadow-md">ชื่อเล่น: -</p>
                </div>
            </div>
            
            <!-- Content Area -->
            <div class="overflow-y-auto p-5 md:p-6 space-y-5 text-gray-800 bg-white">
                <section class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="info-pill bg-slate-50 border-slate-100">
                        <label class="text-[9px] uppercase text-slate-400 font-black block mb-0.5">ตำแหน่งปัจจุบัน</label>
                        <span id="modalPosition" class="text-slate-700 font-bold text-sm md:text-base">-</span>
                    </div>
                    <div class="info-pill bg-slate-50 border-slate-100">
                        <label class="text-[9px] uppercase text-slate-400 font-black block mb-0.5">เบอร์โทรศัพท์</label>
                        <!-- แสดงเบอร์โทรศัพท์ -->
                        <span id="modalPhone" class="text-blue-700 font-black text-sm md:text-base">-</span>
                    </div>
                    <div class="info-pill bg-slate-50 border-slate-100">
                        <label class="text-[9px] uppercase text-slate-400 font-black block mb-0.5">Instagram</label>
                        <span id="modalIG" class="text-pink-600 font-black text-sm md:text-base">-</span>
                    </div>
                    <div class="info-pill bg-slate-50 border-slate-100">
                        <label class="text-[9px] uppercase text-slate-400 font-black block mb-0.5">สถานะ</label>
                        <span id="modalStatus" class="text-blue-800 font-bold text-sm md:text-base">-</span>
                    </div>
                </section>

                <section>
                    <label class="text-[9px] uppercase text-slate-400 font-black block mb-1.5">ข้อความถึงเพื่อน</label>
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-blue-900 italic font-medium leading-relaxed text-sm">
                        <p id="modalMessage">"-"</p>
                    </div>
                </section>

                <button onclick="closeModal()" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-black text-base hover:bg-black transition-all shadow-xl active:scale-95">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCJUfNHvOshKc8afyHvk_aJubIjzr5Z1kysOYilI2FQmqu2zMn2kkah3y53X9BgnE0voLwuwplHbB3/pub?output=csv';
        let studentData = [];
        const SEATS_PER_ROW = 12;

        const MALE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-slate-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
        const FEMALE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-pink-200" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/><path d="M12 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" opacity=".3"/></svg>`;

        function getVal(row, headerName) {
            if (!row || !headerName) return null;
            const keys = Object.keys(row);
            // ค้นหาหัวคอลัมน์ที่ตรงกัน (ไม่สนใจช่องว่างหน้าหลังและตัวเล็กใหญ่)
            const targetKey = keys.find(k => k.trim().toLowerCase() === headerName.trim().toLowerCase());
            return targetKey ? row[targetKey] : null;
        }

        function getDutyDateString() {
            const now = new Date();
            return `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
        }

        function checkDuty(student) {
            const dutyContent = getVal(student, "เวรทั่วไป/เวรต้อนรับ");
            return dutyContent ? dutyContent.toString().trim().includes(getDutyDateString()) : false;
        }

        function formatDriveLink(url) {
            if (!url || typeof url !== 'string') return "";
            const match = url.match(/(?:id=|d\/)([a-zA-Z0-9_-]+)/);
            return match ? `https://lh3.googleusercontent.com/d/${match[1]}` : url;
        }

        function getImageUrl(student) {
            return formatDriveLink(getVal(student, 'รูปภาพประกอบ') || getVal(student, 'รูปภาพ') || student['Link']);
        }

        function initApp() {
            const now = new Date();
            document.getElementById('todayDateDisplay').innerText = `วันที่ ${getDutyDateString()}`;
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    studentData = results.data.filter(row => getVal(row, 'ชื่อ'));
                    renderGrid(studentData);
                    stopRefreshAnimation();
                }
            });
        }

        function renderGrid(data, filter = '') {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';
            const query = filter.toLowerCase().trim();
            const totalRows = Math.ceil(data.length / SEATS_PER_ROW);

            for (let r = 0; r < totalRows; r++) {
                const label = document.createElement('div');
                label.className = "flex items-center justify-center font-black text-blue-900 bg-blue-50 rounded-lg text-[10px]";
                label.innerHTML = `แถว<br>${r + 1}`;
                grid.appendChild(label);

                for (let c = 0; c < SEATS_PER_ROW; c++) {
                    const idx = (r * SEATS_PER_ROW) + c;
                    const student = data[idx];
                    const seatNum = idx + 1;

                    if (student) {
                        const name = (getVal(student, 'ชื่อ') || "").trim();
                        const nickname = (getVal(student, 'ชื่อเล่น') || "").trim();
                        const isFemale = (getVal(student, 'ยศ') || "").includes("หญิง");
                        const hasDuty = checkDuty(student);
                        const isMatch = query === '' || seatNum.toString() === query || name.toLowerCase().includes(query) || nickname.toLowerCase().includes(query);

                        const card = document.createElement('div');
                        let dutyStyle = isFemale ? 'border-pink-200' : 'border-blue-100';
                        if (hasDuty) dutyStyle = isFemale ? 'on-duty-pink-glow' : 'on-duty-glow';

                        card.className = `seat-card relative bg-white rounded-xl shadow-sm flex flex-col items-center p-0 overflow-hidden cursor-pointer border-2 transition-all ${dutyStyle} ${isMatch ? '' : 'opacity-10 grayscale pointer-events-none'}`;
                        
                        const img = getImageUrl(student);
                        card.innerHTML = `
                            <div class="w-full aspect-square bg-slate-50 flex items-center justify-center overflow-hidden border-b border-slate-100">
                                ${img ? `<img src="${img}" class="w-full h-full object-cover">` : (isFemale ? FEMALE_ICON : MALE_ICON)}
                            </div>
                            <div class="p-1.5 w-full text-center">
                                <span class="absolute top-1 left-1.5 text-[7px] text-white bg-black/30 px-1 rounded font-black">#${seatNum}</span>
                                <div class="text-[9px] md:text-[10px] font-bold truncate">${nickname || name}</div>
                            </div>
                        `;
                        card.onclick = () => showModal(student, seatNum, hasDuty, isFemale);
                        grid.appendChild(card);
                    } else {
                        grid.appendChild(document.createElement('div'));
                    }
                }
            }
        }

        function showModal(student, seatNum, hasDuty, isFemale) {
            const rank = (getVal(student, 'ยศ') || "").trim();
            const firstName = (getVal(student, 'ชื่อ') || "").trim();
            const lastName = (getVal(student, 'นามสกุล') || "").trim();
            const nickname = (getVal(student, 'ชื่อเล่น') || "").trim();
            
            // แก้ไขการดึงเบอร์โทรศัพท์ให้ครอบคลุมชื่อหัวคอลัมน์หลายรูปแบบ
            const phoneNumber = getVal(student, 'เบอร์โทรศัพท์') || getVal(student, 'เบอร์โทร') || getVal(student, 'โทร') || '-';
            
            document.getElementById('modalFullName').innerText = `${rank}${firstName} ${lastName}`;
            document.getElementById('modalNickname').innerText = nickname ? `ชื่อเล่น: ${nickname}` : '-';
            document.getElementById('modalPosition').innerText = getVal(student, 'ตำแหน่ง') || '-';
            document.getElementById('modalPhone').innerText = phoneNumber;
            
            const ig = (getVal(student, 'IG') || "").replace('@', '');
            document.getElementById('modalIG').innerHTML = ig ? `<a href="https://instagram.com/${ig}" target="_blank" class="hover:underline">@${ig}</a>` : '-';
            document.getElementById('modalStatus').innerText = getVal(student, 'สถานะ') || '-';
            document.getElementById('modalMessage').innerText = getVal(student, 'อยากจะบอกอะไรกับเพื่อนๆ') || '-';
            document.getElementById('modalSeatNum').innerText = `ที่นั่ง #${seatNum}`;

            const badge = document.getElementById('modalDutyIndicator');
            if(hasDuty) {
                badge.classList.remove('hidden');
                document.getElementById('modalDutyBadge').className = `flex items-center px-4 py-2 rounded-full text-xs font-black shadow-xl ring-2 ring-white animate-bounce ${isFemale ? 'bg-pink-500 text-white' : 'bg-amber-400 text-blue-900'}`;
            } else badge.classList.add('hidden');

            const img = getImageUrl(student);
            const mImg = document.getElementById('modalImg');
            const mPlaceholder = document.getElementById('modalPlaceholderIcon');
            
            if(img) {
                mImg.src = img;
                mImg.classList.remove('hidden');
                mPlaceholder.classList.add('hidden');
            } else {
                mImg.classList.add('hidden');
                mPlaceholder.classList.remove('hidden');
                mPlaceholder.innerHTML = isFemale ? FEMALE_ICON : MALE_ICON;
            }
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }
        function refreshData() { document.getElementById('refreshIcon').classList.add('refresh-spin'); initApp(); }
        function stopRefreshAnimation() { document.getElementById('refreshIcon').classList.remove('refresh-spin'); }

        document.getElementById('searchInput').addEventListener('input', (e) => renderGrid(studentData, e.target.value));
        window.onload = initApp;
    </script>
</body>
</html>
